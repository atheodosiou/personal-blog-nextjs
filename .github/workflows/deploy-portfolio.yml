name: Portfolio checks and deployment

on:
  push:
    branches: [rebranding-2026]
  pull_request:
    branches: [rebranding-2026]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  validate:
    name: Validate portfolio
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - name: Check deployment branch
        if: github.event_name == 'workflow_dispatch'
        env:
          SELECTED_REF: ${{ github.ref }}
        run: |
          if [[ "$SELECTED_REF" != refs/heads/rebranding-2026 ]]; then
            echo '::error::Select rebranding-2026 in the Run workflow branch menu.'
            exit 1
          fi
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: false
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version: '22'
          cache: npm
      - run: npm ci --include=dev
      - run: npm run lint
      - run: npm run test:consent
      - run: npm run test:analytics
      - run: npm run test:deploy
      - name: Check shell scripts
        run: |
          for script in scripts/deploy/*.sh; do bash -n "$script"; done
          shellcheck scripts/deploy/*.sh
      - run: npm audit --omit=dev
      - name: Report public HTTP reachability
        run: node scripts/report-public-access.mjs

  deploy:
    name: Deploy to Contabo
    if: github.event_name == 'workflow_dispatch' && github.ref == 'refs/heads/rebranding-2026'
    needs: validate
    runs-on: ubuntu-24.04
    timeout-minutes: 35
    environment:
      name: production
      url: https://anastasios.theodosiou.me
    concurrency:
      group: portfolio-production
      cancel-in-progress: false
    env:
      DEPLOY_HOST: ${{ secrets.PORTFOLIO_SSH_HOST }}
      DEPLOY_PORT: ${{ vars.PORTFOLIO_SSH_PORT || '22' }}
      GAID: G-E4G1QVX7T9
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: false
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version: '22'
          package-manager-cache: false
      - name: Configure restricted SSH connection
        env:
          SSH_PRIVATE_KEY: ${{ secrets.PORTFOLIO_SSH_KEY }}
          SSH_KNOWN_HOSTS: ${{ secrets.PORTFOLIO_SSH_KNOWN_HOSTS }}
        run: |
          set -Eeuo pipefail
          [[ "$DEPLOY_HOST" =~ ^[a-zA-Z0-9][a-zA-Z0-9.-]*$ ]]
          [[ "$DEPLOY_PORT" =~ ^[0-9]{1,5}$ ]]
          (( DEPLOY_PORT >= 1 && DEPLOY_PORT <= 65535 ))
          test -n "$SSH_PRIVATE_KEY"
          test -n "$SSH_KNOWN_HOSTS"
          umask 077
          mkdir -p "$RUNNER_TEMP/portfolio-ssh"
          printf '%s\n' "$SSH_PRIVATE_KEY" > "$RUNNER_TEMP/portfolio-ssh/key"
          printf '%s\n' "$SSH_KNOWN_HOSTS" > "$RUNNER_TEMP/portfolio-ssh/known_hosts"
          ssh-keygen -y -P '' -f "$RUNNER_TEMP/portfolio-ssh/key" > /dev/null
          lookup="$DEPLOY_HOST"
          if [[ "$DEPLOY_PORT" != 22 ]]; then lookup="[$DEPLOY_HOST]:$DEPLOY_PORT"; fi
          ssh-keygen -F "$lookup" -f "$RUNNER_TEMP/portfolio-ssh/known_hosts" > /dev/null
      - name: Build, preview, switch PM2 and verify origin
        env:
          RELEASE_SHA: ${{ github.sha }}
        run: |
          set -Eeuo pipefail
          [[ "$RELEASE_SHA" =~ ^[a-f0-9]{40}$ ]]
          ssh -T -p "$DEPLOY_PORT" \
            -i "$RUNNER_TEMP/portfolio-ssh/key" \
            -o BatchMode=yes -o IdentitiesOnly=yes \
            -o StrictHostKeyChecking=yes \
            -o UserKnownHostsFile="$RUNNER_TEMP/portfolio-ssh/known_hosts" \
            -o GlobalKnownHostsFile=/dev/null \
            -o ConnectTimeout=20 -o ServerAliveInterval=30 \
            -o ServerAliveCountMax=6 \
            "root@$DEPLOY_HOST" "deploy $RELEASE_SHA"
      - name: Verify public HTTPS site
        run: |
          node scripts/check-seo.mjs https://anastasios.theodosiou.me
          node scripts/check-privacy.mjs https://anastasios.theodosiou.me
          node scripts/check-deployment.mjs https://anastasios.theodosiou.me
      - name: Deployment summary
        if: success()
        env:
          RELEASE_SHA: ${{ github.sha }}
        run: |
          printf '### Portfolio deployed\n\nCommit: %s\n\n[Open portfolio](https://anastasios.theodosiou.me)\n' \
            "$RELEASE_SHA" >> "$GITHUB_STEP_SUMMARY"
      - name: Remove runner SSH files
        if: always()
        run: rm -f -- "$RUNNER_TEMP/portfolio-ssh/key" "$RUNNER_TEMP/portfolio-ssh/known_hosts"
